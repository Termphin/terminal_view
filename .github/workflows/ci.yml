name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to the Flutter line Termphin builds with. A newer stable can
      # deprecate an API the app's own version still needs, and the analyzer
      # fails the run on it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Benchmark
        run: dart run benchmark/terminal_benchmark.dart
